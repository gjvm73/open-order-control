<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #FFFFFF; color: #1A1A1A; overflow: hidden; }
      .slide-container { width: 1280px; min-height: 720px; position: relative; display: flex; flex-direction: column; justify-content: center; padding: 80px; }
      .hr-top { width: 100px; height: 4px; background-color: #B40000; margin-bottom: 20px; }
      .title-group { max-width: 800px; }
      .main-title { font-size: 84px; font-weight: 900; line-height: 0.9; text-transform: uppercase; letter-spacing: -2px; margin-bottom: 20px; color: #1A1A1A; }
      .sub-title { font-size: 32px; font-weight: 300; color: #B40000; margin-bottom: 60px; }
      .footer-info { position: absolute; bottom: 80px; left: 80px; font-size: 18px; color: #666; font-weight: 400; }
      .accent-block { position: absolute; right: 0; top: 0; bottom: 0; width: 300px; background-color: #B40000; }
      .grid-element { position: absolute; right: 350px; bottom: 80px; font-size: 120px; font-weight: 900; color: #F0F0F0; z-index: -1; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-block"></div>
        <div class="grid-element">2026</div>
        <div class="hr-top"></div>
        <div class="title-group">
            <h1 class="main-title">Open Order<br>Control</h1>
            <h2 class="sub-title">Governança de Prazos e Visão Executiva</h2>
        </div>
        <div class="footer-info">
            Relatório Estratégico para Diretoria<br>
            Agosto 2026
        </div>
    </div>
</body>
</html>
